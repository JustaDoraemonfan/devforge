services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: devforge
      POSTGRES_PASSWORD: devforge
      POSTGRES_DB: devforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devforge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
